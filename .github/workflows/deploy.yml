name: Continuous Integration
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main"]

jobs:
  validacao-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Checar arquivos estaticos
        run: |
          ls -R
          echo "Arquivos listados no Runner"

      - name: Checkout do codigo
        uses: actions/checkout@v3

      - name : Validar sintaxe HTML
        uses: amitsingh-007/html-validator-action@v1.0.0
        with:
          target: './index.html'

